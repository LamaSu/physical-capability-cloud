[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Optimizer REQUIRED: without it MilestoneEscrow/PCCProtocol (and the V2 pair)
# exceed the EIP-170 24,576-byte runtime limit and are undeployable. runs=200
# keeps PCCProtocolV2 (the largest, it embeds the child initcode) at ~22.7KB.
optimizer = true
optimizer_runs = 200

[profile.default.fmt]
line_length = 120
tab_width = 4

[profile.ci]
fuzz = { runs = 1000 }

# ── Deployment ───────────────────────────────────────────────────────────────

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
localhost = "http://127.0.0.1:8545"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api", chain = 84532 }

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Read-only access to the committed golden vectors (evidence-lane Step-10 conformance
# fixtures) consumed by test/Step10GoldenParity.t.sol — the M2 cross-language parity gate.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
# EIP-170 (24,576 B runtime) fix: without the optimizer, MilestoneEscrow(V1/V2)
# and PCCProtocol(V1/V2) exceed the contract-size limit and are undeployable.
# runs=200 is the standard size/gas balance; verified all contracts fit (see PR).
optimizer = true
optimizer_runs = 200

[profile.default.fmt]
line_length = 120
tab_width = 4

[profile.ci]
fuzz = { runs = 1000 }

# ── Deployment ───────────────────────────────────────────────────────────────

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base = "https://mainnet.base.org"
localhost = "http://127.0.0.1:8545"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api", chain = 84532 }
base = { key = "${ETHERSCAN_API_KEY}", url = "https://api.basescan.org/api", chain = 8453 }

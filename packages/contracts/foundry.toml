[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# EIP-170 (24,576 B runtime) fix: without the optimizer, MilestoneEscrow(V1/V2)
# and PCCProtocol(V1/V2) exceed the contract-size limit and are undeployable.
# runs=200 is the standard size/gas balance; verified all contracts fit (see PR).
optimizer = true
optimizer_runs = 200
# DeployVNextSettlement.s.sol persists its address/codehash record under `deployments/vnext/` (vm.writeJson)
# and reads an existing record back to refuse publishing a rival deployment (vm.exists / vm.readFile). Grant
# exactly that directory, nothing wider: the rest of `deployments/` holds the live Base Sepolia records
# (PCCProtocolV2, CaptureClassRegistry, EASSchema, SampleEscrow), which no forge test or script may overwrite.
# `VNextDeployRecordTest.test_Record_GrantDoesNotReachOtherDeploymentRecords` fails if this is widened.
# The grant is NOT a containment boundary against symlinks: Foundry authorizes a not-yet-existing path by
# lexical normalization, so a symlinked directory or a dangling link under it can redirect a write. The deploy
# script therefore refuses any symlink under `deployments/vnext` before it reads or writes a record, and CI
# refuses a committed symlink anywhere under `deployments/` (ts/__tests__/deployments-no-symlinks.test.ts).
# The second entry is READ-only on a committed test fixture of symlinks, so that refusal is tested.
#
# NOTE — deliberately ABSENT: a `libraries = [...]` entry. {VNextSettlementLib} is an external linked
# library, and pinning its address here would link the TEST build against an address holding no code,
# breaking every funding test. The V-next deploy scripts link per-invocation with `--libraries` instead
# and assert the address they were linked against. See script/DeployVNextSettlement.s.sol.
fs_permissions = [
    { access = "read-write", path = "./deployments/vnext" },
    { access = "read", path = "./test/fixtures/fs-symlinks" },
]

[profile.default.fmt]
line_length = 120
tab_width = 4

[profile.ci]
fuzz = { runs = 1000 }

# ── Deployment ───────────────────────────────────────────────────────────────

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base = "https://mainnet.base.org"
localhost = "http://127.0.0.1:8545"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api", chain = 84532 }
base = { key = "${ETHERSCAN_API_KEY}", url = "https://api.basescan.org/api", chain = 8453 }

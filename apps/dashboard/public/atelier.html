<!DOCTYPE html>
<!-- pattern: 04-agentic-ux-patterns.md §Generative UI failure modes — the recognized gaps (fix #3:
     "loss of mental model / consistency… keep a STABLE shell/spatial layout so only content
     regenerates") + §Emil Kowalski (loading choreography: skeleton/shimmer, never a bare spinner,
     <300ms micro-motion) + §Generative UI failure modes gap #10 (ARIA live-region discipline for
     streamed content).

     WHAT THIS IS: the stable-shell pattern. Header and nav are fixed chrome, built once, and are
     NEVER touched again. Exactly ONE region (#atl-content) is handed to the renderer as its `mount`;
     every regeneration — a full render() or an RFC-6902 applyPatch() — replaces only that region.
     Because the renderer's `render()` never reaches outside its `mount` element, this invariant is
     structural, not a discipline the caller has to remember.

     SINGLE-FILE: no build step, no CDN, no external fetch. The renderer + governed component catalog
     are inlined verbatim below (source of truth: assets/renderer/component-tree-renderer.mjs and
     assets/renderer/component-catalog.mjs — copy this file's <script> back in sync if those change).
     Inlining (rather than a relative `<script src="../renderer/…">`) is deliberate: SPEC.md §7.4 calls
     for the Artifact-tool publishing path to carry the renderer inline, and a relative ES-module import
     does not reliably load when a template is opened directly via file:// (Chromium/Firefox block
     cross-origin / file-scheme module fetches) — inlining is what makes "works when opened directly"
     actually true. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCC — governed UI renderer</title>
<style>
  :root {
    --atl-fg: #1a1a19;
    --atl-fg-muted: #6b6b66;
    --atl-surface: #f7f7f5;
    --atl-surface-2: #ecece8;
    --atl-border: #e3e3df;
    --atl-accent: #5b5bd6;
    --atl-accent-fg: #ffffff;
    --atl-danger: #c53030;
    --atl-warn: #b7791f;
    --atl-ok: #2f855a;
    --atl-radius: 10px;
    --atl-radius-sm: 6px;
    --atl-space-2: 8px;
    --atl-space-3: 12px;
    --atl-space-4: 16px;
    --atl-font-mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    --atl-dur-1: 120ms;
    --atl-dur-2: 200ms;
    --atl-ease-out: ease-out;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: var(--atl-surface-2);
    color: var(--atl-fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .atl-shell {
    display: grid;
    grid-template-rows: auto auto 1fr;
    min-height: 100vh;
  }
  .atl-shell-header {
    display: flex; align-items: center; justify-content: space-between; gap: var(--atl-space-3);
    padding: var(--atl-space-3) var(--atl-space-4);
    background: var(--atl-surface);
    border-bottom: 1px solid var(--atl-border);
  }
  .atl-shell-title { font-weight: 680; letter-spacing: -0.01em; }
  .atl-shell-subtitle { margin-top: 2px; font-size: 0.85em; color: var(--atl-fg-muted); }
  .atl-shell-actions { display: flex; gap: var(--atl-space-2); align-items: center; flex-wrap: wrap; }
  .atl-shell-btn {
    appearance: none; border-radius: var(--atl-radius-sm); padding: 7px 12px; font: inherit; cursor: pointer;
    border: 1px solid var(--atl-border); background: var(--atl-surface-2); color: var(--atl-fg);
    transition: transform var(--atl-dur-1) var(--atl-ease-out);
  }
  .atl-shell-btn:hover { transform: translateY(-1px); }
  .atl-shell-btn.primary { background: var(--atl-accent); color: var(--atl-accent-fg); border-color: transparent; }
  .atl-shell-activity {
    font-size: 0.8em; color: var(--atl-fg-muted); font-family: var(--atl-font-mono);
    min-height: 1.2em; max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .atl-shell-nav {
    display: flex; gap: var(--atl-space-2); padding: var(--atl-space-2) var(--atl-space-4);
    background: var(--atl-surface); border-bottom: 1px solid var(--atl-border);
  }
  .atl-shell-nav a {
    display: inline-block; padding: 6px 10px; border-radius: var(--atl-radius-sm);
    color: var(--atl-fg-muted); text-decoration: none; font-size: 0.9em;
    border-bottom: 2px solid transparent;
  }
  .atl-shell-nav a.active { color: var(--atl-fg); border-bottom-color: var(--atl-accent); font-weight: 620; }
  .atl-shell-content { padding: var(--atl-space-4); max-width: 720px; margin: 0 auto; width: 100%; }

  /* Loading choreography: skeleton shimmer, never a bare spinner (03-react-ui-craft.md §Emil Kowalski). */
  @keyframes atl-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .atl-skeleton {
    height: 220px; border-radius: var(--atl-radius);
    background: linear-gradient(90deg, var(--atl-surface-2) 25%, var(--atl-border) 37%, var(--atl-surface-2) 63%);
    background-size: 400% 100%;
    animation: atl-shimmer 1.4s ease infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .atl-skeleton { animation: none; }
    .atl-shell-btn { transition: none; }
  }
</style>
</head>
<body>
  <div class="atl-shell">
    <header class="atl-shell-header">
      <div>
        <div class="atl-shell-title">PCC — governed UI renderer</div>
        <div class="atl-shell-subtitle">governed ui-tree renderer · capability.network</div>
      </div>
      <div class="atl-shell-actions">
        <span id="atl-activity" class="atl-shell-activity" aria-live="polite"></span>
      </div>
    </header>
    <!-- Decorative, static nav — never rebuilt by render(). Real integrations can wire these to routes;
         the point demonstrated here is that they are outside the renderer's `mount` and therefore
         immune to whatever the content region does. -->
    <nav class="atl-shell-nav" aria-label="Sections (static — not regenerated)">
      <a href="#" class="active" aria-current="page">Overview</a>
      <a href="#">History</a>
      <a href="#">Settings</a>
    </nav>
    <main id="atl-content" class="atl-shell-content" aria-live="polite" aria-busy="true">
      <div class="atl-skeleton" role="status" aria-label="Loading content"></div>
    </main>
  </div>

  <script type="module">
    // ============================================================================================
    // BEGIN inlined copy of assets/renderer/component-catalog.mjs (verbatim, source of truth there)
    // ============================================================================================
    // pattern: 01-agui-ecosystem.md §generative-UI component catalog (governed declarative primitives)
    //
    // The default governed catalog: ~24 primitives the Declarative tier composes from. Every factory is
    // (node, ctx) => Element. Hard rules, enforced here so they cannot be prompted away:
    //   • All model-provided text is written with textContent (via ctx.h's `text`) — never innerHTML.
    //   • The single exception is `markdown`, whose text runs through ctx.sanitizeMarkdown (allowlist) first.
    //   • `image` and any link accept only safe URL protocols; anything else is dropped to text.
    //   • Components never call a capability directly. Interactive parts dispatch through ctx.dispatchAction,
    //     the renderer's single gated seam. Nothing auto-fires.
    //   • Styling comes exclusively from CSS custom properties (--atl-*) emitted by `tokenize`; the literal
    //     fallbacks are the default token values, so a component is legible before tokens.css loads and
    //     fully themed after.

    const SAFE_URL = /^(https?:|data:image\/(png|jpe?g|gif|webp|svg\+xml);|mailto:|tel:)/i;

    function isSafeUrl(u) {
      if (typeof u !== 'string') return false;
      const s = u.trim();
      if (s.startsWith('/') || s.startsWith('./') || s.startsWith('../') || s.startsWith('#')) return true;
      return SAFE_URL.test(s);
    }

    function str(v) {
      if (v == null) return '';
      if (typeof v === 'object') { try { return JSON.stringify(v); } catch { return String(v); } }
      return String(v);
    }

    const componentCatalog = {
      card(node, ctx) {
        const p = node.props || {};
        const el = ctx.h('section', { class: 'atl-card', style: cardStyle() });
        if (p.title) el.appendChild(ctx.h('h3', { class: 'atl-card-title', text: str(p.title), style: titleStyle() }));
        if (p.subtitle) el.appendChild(ctx.h('p', { class: 'atl-card-sub', text: str(p.subtitle), style: mutedStyle() }));
        appendChildren(el, node, ctx);
        return el;
      },

      grid(node, ctx) {
        const cols = clampInt((node.props || {}).columns, 1, 6, 2);
        const el = ctx.h('div', {
          class: 'atl-grid',
          style: `display:grid;gap:var(--atl-space-4,16px);grid-template-columns:repeat(${cols},minmax(0,1fr))`,
        });
        appendChildren(el, node, ctx);
        return el;
      },

      bento(node, ctx) { return componentCatalog.grid(node, ctx); },

      list(node, ctx) {
        const p = node.props || {};
        const ordered = !!p.ordered;
        const el = ctx.h(ordered ? 'ol' : 'ul', { class: 'atl-list', style: 'margin:0;padding-left:1.25em;display:grid;gap:var(--atl-space-2,8px)' });
        if (Array.isArray(p.items)) {
          for (const item of p.items) el.appendChild(ctx.h('li', { text: str(item) }));
        }
        for (const child of node.children || []) {
          const li = ctx.h('li');
          li.appendChild(ctx.renderNode(child));
          el.appendChild(li);
        }
        return el;
      },

      table(node, ctx) {
        const p = node.props || {};
        const columns = Array.isArray(p.columns) ? p.columns : [];
        const rows = Array.isArray(p.rows) ? p.rows : [];
        const el = ctx.h('table', { class: 'atl-table', style: 'border-collapse:collapse;width:100%;font:var(--atl-font,inherit)' });
        if (columns.length) {
          const thead = ctx.h('thead');
          const tr = ctx.h('tr');
          for (const c of columns) tr.appendChild(ctx.h('th', { text: str(c), style: thStyle() }));
          thead.appendChild(tr);
          el.appendChild(thead);
        }
        const tbody = ctx.h('tbody');
        for (const row of rows) {
          const tr = ctx.h('tr');
          const cells = Array.isArray(row) ? row : columns.map((c) => (row && typeof row === 'object' ? row[c] : ''));
          for (const cell of cells) tr.appendChild(ctx.h('td', { text: str(cell), style: tdStyle() }));
          tbody.appendChild(tr);
        }
        el.appendChild(tbody);
        return el;
      },

      tabs(node, ctx) {
        const p = node.props || {};
        const items = Array.isArray(p.tabs) ? p.tabs : [];
        const el = ctx.h('div', { class: 'atl-tabs' });
        const bar = ctx.h('div', { class: 'atl-tab-bar', role: 'tablist', style: 'display:flex;gap:var(--atl-space-2,8px);border-bottom:1px solid var(--atl-border,#e3e3df)' });
        const panels = ctx.h('div', { class: 'atl-tab-panels', style: 'padding-top:var(--atl-space-3,12px)' });
        const children = node.children || [];
        items.forEach((label, i) => {
          const selected = i === (p.active || 0);
          const tab = ctx.h('button', {
            class: 'atl-tab', role: 'tab', type: 'button', 'aria-selected': String(selected),
            text: str(label), style: tabStyle(selected),
          });
          const panel = ctx.h('div', { class: 'atl-tab-panel', role: 'tabpanel', style: selected ? '' : 'display:none' });
          if (children[i]) panel.appendChild(ctx.renderNode(children[i]));
          tab.addEventListener('click', () => {
            [...bar.children].forEach((t, ti) => { t.setAttribute('aria-selected', String(ti === i)); t.setAttribute('style', tabStyle(ti === i)); });
            [...panels.children].forEach((pn, pi) => pn.setAttribute('style', pi === i ? '' : 'display:none'));
          });
          bar.appendChild(tab);
          panels.appendChild(panel);
        });
        el.appendChild(bar);
        el.appendChild(panels);
        return el;
      },

      timeline(node, ctx) {
        const p = node.props || {};
        const events = Array.isArray(p.events) ? p.events : [];
        const el = ctx.h('ol', { class: 'atl-timeline', style: 'list-style:none;margin:0;padding:0;display:grid;gap:var(--atl-space-3,12px)' });
        for (const ev of events) {
          const li = ctx.h('li', { class: 'atl-timeline-item', style: 'display:grid;grid-template-columns:auto 1fr;gap:var(--atl-space-3,12px)' });
          li.appendChild(ctx.h('span', { class: 'atl-timeline-dot', 'aria-hidden': 'true', style: 'width:10px;height:10px;border-radius:50%;background:var(--atl-accent,#5b5bd6);margin-top:6px' }));
          const body = ctx.h('div');
          if (ev && ev.time) body.appendChild(ctx.h('div', { class: 'atl-timeline-time', text: str(ev.time), style: mutedStyle() }));
          body.appendChild(ctx.h('div', { class: 'atl-timeline-label', text: str(ev && ev.label != null ? ev.label : ev) }));
          li.appendChild(body);
          el.appendChild(li);
        }
        return el;
      },

      heading(node, ctx) {
        const p = node.props || {};
        const level = clampInt(p.level, 1, 6, 2);
        return ctx.h('h' + level, { class: 'atl-heading', text: str(p.text), style: 'margin:0;font-weight:650' });
      },

      text(node, ctx) {
        const p = node.props || {};
        return ctx.h('p', { class: 'atl-text', text: str(p.text), style: 'margin:0;line-height:1.55;color:var(--atl-fg,#1a1a19)' });
      },

      divider(node, ctx) {
        return ctx.h('hr', { class: 'atl-divider', style: 'border:none;border-top:1px solid var(--atl-border,#e3e3df);margin:var(--atl-space-3,12px) 0' });
      },

      badge(node, ctx) {
        const p = node.props || {};
        const tone = ({ ok: 'var(--atl-ok,#2f855a)', warn: 'var(--atl-warn,#b7791f)', danger: 'var(--atl-danger,#c53030)' })[p.tone] || 'var(--atl-accent,#5b5bd6)';
        return ctx.h('span', {
          class: 'atl-badge', text: str(p.label),
          style: `display:inline-block;padding:2px 8px;border-radius:999px;font-size:0.78em;color:#fff;background:${tone}`,
        });
      },

      stat(node, ctx) {
        const p = node.props || {};
        const el = ctx.h('div', { class: 'atl-stat', style: 'display:grid;gap:2px' });
        el.appendChild(ctx.h('div', { class: 'atl-stat-value', text: str(p.value), style: 'font-size:1.6em;font-weight:680;letter-spacing:-0.01em' }));
        if (p.label != null) el.appendChild(ctx.h('div', { class: 'atl-stat-label', text: str(p.label), style: mutedStyle() }));
        if (p.delta != null) el.appendChild(ctx.h('div', { class: 'atl-stat-delta', text: str(p.delta), style: 'font-size:0.85em;color:var(--atl-fg-muted,#6b6b66)' }));
        return el;
      },

      progress(node, ctx) {
        const p = node.props || {};
        const value = clampInt(p.value, 0, 100, 0);
        const el = ctx.h('div', { class: 'atl-progress' });
        if (p.label != null) el.appendChild(ctx.h('div', { class: 'atl-progress-label', text: str(p.label), style: mutedStyle() }));
        const track = ctx.h('div', { class: 'atl-progress-track', role: 'progressbar', 'aria-valuenow': String(value), 'aria-valuemin': '0', 'aria-valuemax': '100', style: 'height:8px;border-radius:999px;background:var(--atl-surface-2,#ecece8);overflow:hidden' });
        track.appendChild(ctx.h('div', { class: 'atl-progress-fill', style: `height:100%;width:${value}%;background:var(--atl-accent,#5b5bd6);transition:width var(--atl-dur-2,200ms) var(--atl-ease-out,ease-out)` }));
        el.appendChild(track);
        return el;
      },

      markdown(node, ctx) {
        const p = node.props || {};
        const el = ctx.h('div', { class: 'atl-markdown', style: 'line-height:1.55' });
        if (typeof ctx.sanitizeMarkdown === 'function') {
          el.innerHTML = ctx.sanitizeMarkdown(str(p.text));
        } else {
          el.textContent = str(p.text);
        }
        return el;
      },

      image(node, ctx) {
        const p = node.props || {};
        if (!isSafeUrl(p.src)) {
          return ctx.h('div', { class: 'atl-image-blocked', text: `[image blocked: unsafe src] ${str(p.alt || '')}`.trim(), style: mutedStyle() });
        }
        return ctx.h('img', { class: 'atl-image', src: String(p.src), alt: str(p.alt || ''), loading: 'lazy', style: 'max-width:100%;height:auto;border-radius:var(--atl-radius,10px)' });
      },

      chart(node, ctx) {
        const p = node.props || {};
        const fig = ctx.h('figure', { class: 'atl-chart', style: cardStyle() });
        if (p.title) fig.appendChild(ctx.h('figcaption', { class: 'atl-chart-title', text: str(p.title), style: titleStyle() }));
        const kind = str(p.spec && p.spec.mark ? p.spec.mark : p.kind || 'chart');
        const n = Array.isArray(p.spec && p.spec.data ? p.spec.data : p.data) ? (p.spec && p.spec.data ? p.spec.data : p.data).length : 0;
        fig.appendChild(ctx.h('div', { class: 'atl-chart-placeholder', text: `${kind} · ${n} point${n === 1 ? '' : 's'} — hand to dataviz to render`, style: `display:grid;place-items:center;min-height:120px;color:var(--atl-fg-muted,#6b6b66);background:var(--atl-surface-2,#ecece8);border-radius:var(--atl-radius,10px)` }));
        try { fig.__atelierChartSpec = p.spec || { mark: p.kind, data: p.data }; } catch { /* frozen target */ }
        return fig;
      },

      button(node, ctx) {
        const p = node.props || {};
        const action = (node.actions && node.actions[0]) || null;
        const btn = ctx.h('button', { class: 'atl-button', type: 'button', text: str(p.label || (action && action.label) || 'Action'), style: buttonStyle(p.variant) });
        if (action) {
          btn.addEventListener('click', () => ctx.dispatchAction(action, node));
        } else {
          btn.disabled = true;
        }
        markActionsHandled(btn);
        return btn;
      },

      field(node, ctx) {
        const p = node.props || {};
        const id = 'atl-f-' + (node.id || Math.abs(hash(str(p.name || p.label))));
        const wrap = ctx.h('label', { class: 'atl-field', for: id, style: 'display:grid;gap:4px' });
        if (p.label != null) wrap.appendChild(ctx.h('span', { class: 'atl-field-label', text: str(p.label), style: 'font-size:0.9em;color:var(--atl-fg-muted,#6b6b66)' }));
        const input = buildInput(p, id, ctx);
        input.classList.add('atl-input');
        input.setAttribute('name', str(p.name || node.id || 'field'));
        wrap.appendChild(input);
        return wrap;
      },

      form(node, ctx) {
        const p = node.props || {};
        const form = ctx.h('form', { class: 'atl-form', style: 'display:grid;gap:var(--atl-space-3,12px)' });
        form.addEventListener('submit', (e) => e.preventDefault());
        for (const child of node.children || []) form.appendChild(ctx.renderNode(child));
        if (Array.isArray(p.fields)) {
          for (const f of p.fields) form.appendChild(componentCatalog.field({ type: 'field', props: f }, ctx));
        }
        const actions = node.actions || [];
        if (actions.length) {
          const bar = ctx.h('div', { class: 'atl-form-actions', style: 'display:flex;gap:var(--atl-space-2,8px);flex-wrap:wrap' });
          for (const action of actions) {
            const btn = ctx.h('button', { class: 'atl-button', type: 'submit', text: str(action.label), style: buttonStyle('primary') });
            btn.addEventListener('click', (e) => {
              e.preventDefault();
              const values = collectFormValues(form);
              ctx.dispatchAction(action, node, { values });
            });
            bar.appendChild(btn);
          }
          form.appendChild(bar);
          markActionsHandled(form);
        }
        return form;
      },

      'approval-card'(node, ctx) {
        const p = node.props || {};
        const el = ctx.h('section', { class: 'atl-approval-card', role: 'group', 'aria-label': 'Approval required', style: `${cardStyle()};border-left:3px solid var(--atl-warn,#b7791f)` });
        el.appendChild(ctx.h('div', { class: 'atl-approval-head', text: str(p.title || 'Approval required'), style: titleStyle() }));
        if (p.summary) el.appendChild(ctx.h('p', { class: 'atl-approval-summary', text: str(p.summary), style: mutedStyle() }));
        if (p.trust) el.appendChild(componentCatalog.badge({ props: { label: `trust: ${str(p.trust)}`, tone: p.trust === 'read' ? 'ok' : 'warn' } }, ctx));
        const decisions = node.actions && node.actions.length ? node.actions : defaultDecisions(p);
        const bar = ctx.h('div', { class: 'atl-approval-actions', style: 'display:flex;gap:var(--atl-space-2,8px);flex-wrap:wrap;margin-top:var(--atl-space-3,12px)' });
        for (const d of decisions) {
          const btn = ctx.h('button', { class: 'atl-button', type: 'button', text: str(d.label), style: buttonStyle(d.id === 'approve' ? 'primary' : d.id === 'reject' ? 'danger' : 'ghost') });
          btn.addEventListener('click', () => ctx.dispatchAction(d, node));
          bar.appendChild(btn);
        }
        el.appendChild(bar);
        markActionsHandled(el);
        return el;
      },

      'confidence-badge'(node, ctx) {
        const p = node.props || {};
        const level = ['low', 'med', 'high'].includes(p.level) ? p.level : 'med';
        const tone = { low: 'var(--atl-danger,#c53030)', med: 'var(--atl-warn,#b7791f)', high: 'var(--atl-ok,#2f855a)' }[level];
        const el = ctx.h('span', { class: 'atl-confidence', title: (p.drivers || []).map(str).join('; '), style: `display:inline-flex;align-items:center;gap:6px;font-size:0.8em;color:var(--atl-fg-muted,#6b6b66)` });
        el.appendChild(ctx.h('span', { 'aria-hidden': 'true', style: `width:8px;height:8px;border-radius:50%;background:${tone}` }));
        el.appendChild(ctx.h('span', { text: `confidence: ${level}` }));
        return el;
      },

      footprints(node, ctx) {
        const p = node.props || {};
        const items = Array.isArray(p.items) ? p.items : [];
        const el = ctx.h('div', { class: 'atl-footprints', role: 'group', 'aria-label': 'Side effects', style: 'display:grid;gap:6px' });
        el.appendChild(ctx.h('div', { class: 'atl-footprints-head', text: 'This can change:', style: mutedStyle() }));
        for (const f of items) {
          const row = ctx.h('div', { class: 'atl-footprint', style: 'display:flex;gap:8px;align-items:baseline' });
          row.appendChild(componentCatalog.badge({ props: { label: str(f.trust || 'read'), tone: (f.trust && f.trust !== 'read') ? 'warn' : 'ok' } }, ctx));
          row.appendChild(ctx.h('span', { text: str(f.summary || f.capability) }));
          el.appendChild(row);
        }
        return el;
      },

      plan(node, ctx) {
        const p = node.props || {};
        const steps = Array.isArray(p.steps) ? p.steps : [];
        const el = ctx.h('div', { class: 'atl-plan', style: cardStyle() });
        el.appendChild(ctx.h('div', { class: 'atl-plan-head', text: str(p.title || 'Planned actions'), style: titleStyle() }));
        const ol = ctx.h('ol', { class: 'atl-plan-steps', style: 'margin:8px 0 0;padding-left:1.25em;display:grid;gap:6px' });
        for (const s of steps) {
          const li = ctx.h('li');
          li.appendChild(ctx.h('span', { text: str(s && s.label != null ? s.label : s) }));

    function setActivity(msg) { if (activityEl) activityEl.textContent = String(msg); }

    const renderer = createRenderer({
      mount: mountEl,
      onAction(action, ctx) {
        const req = { kind: 'action-request', action, values: ctx && ctx.values, trust: action && action.trust };
        try { if (window.parent && window.parent !== window) window.parent.postMessage(req, '*'); } catch (_) {}
        try { mountEl.dispatchEvent(new CustomEvent('atelier:action-request', { bubbles: true, detail: req })); } catch (_) {}
        setActivity('action: ' + (action && action.capability) + ' (' + (action && action.trust) + ') — relayed to host, not executed here');
      },
    });

    function placeholder() {
      renderer.render({ kind: 'ui-tree', version: 1, meta: { title: 'PCC governed UI renderer' }, root: {
        type: 'card', id: 'wait', props: {
          title: 'Waiting for a ui-tree',
          subtitle: 'postMessage a { kind: "ui-tree" } envelope, or open with ?tree=<base64url JSON>.' } } });
    }

    function tryRender(payload) {
      if (!payload || typeof payload !== 'object') return false;
      if (payload.kind === 'ui-tree') { mountEl.setAttribute('aria-busy', 'false'); renderer.render(payload); setActivity('rendered ui-tree'); return true; }
      if (payload.kind === 'ui-tree-delta') { renderer.applyPatch(payload.ops || []); setActivity('applied ui-tree-delta'); return true; }
      return false;
    }

    // (1) postMessage from an embedder / host
    window.addEventListener('message', (e) => { try { tryRender(e && e.data); } catch (err) { console.warn('[atelier] message render failed', err); } });

    // (2) ?tree= query param — base64url OR URL-encoded JSON
    function fromParam() {
      try {
        const raw = new URLSearchParams(location.search).get('tree');
        if (!raw) return false;
        let json;
        try { json = decodeURIComponent(raw); JSON.parse(json); }
        catch (_) { json = atob(raw.replace(/-/g, '+').replace(/_/g, '/')); }
        return tryRender(JSON.parse(json));
      } catch (err) { console.warn('[atelier] ?tree= parse failed', err); return false; }
    }

    // (3) inline <script id="atl-tree" type="application/json">
    function fromInline() {
      const el = document.getElementById('atl-tree');
      if (!el) return false;
      try { return tryRender(JSON.parse(el.textContent)); } catch (err) { console.warn('[atelier] inline tree parse failed', err); return false; }
    }

    mountEl.setAttribute('aria-busy', 'false');
    if (!fromParam() && !fromInline()) { placeholder(); setActivity('ready — awaiting a ui-tree via postMessage or ?tree='); }
    // Signal an embedder that we are ready to receive a tree.
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ kind: 'atelier-ready' }, '*'); } catch (_) {}
  </script>
</body>
</html>

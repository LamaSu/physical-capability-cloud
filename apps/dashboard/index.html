    <!-- Agent discovery: machine-readable entrypoints -->
    <link rel="alternate" type="application/json" href="/agent-package.json" title="PCC Agent Package — 237 tools for any LLM" />
    <link rel="alternate" type="application/json" href="/.well-known/agent-registration.json" title="ERC-8004 Agent Registration" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt — guidance for AI agents" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://capability.network/#website",
          "url": "https://capability.network",
          "name": "Physical Capability Cloud",
          "description": "The cloud instance for the physical world. Machines, human skills, and autonomous assets register as callable, composable capabilities. Agents discover, price, and orchestrate them with on-chain milestone escrow.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://capability.network/api/capabilities/search?q={query}",
            "query-input": "required name=query"
          }
        },
        {
          "@type": ["SoftwareApplication", "WebAPI"],
          "@id": "https://capability.network/#api",
          "name": "PCC Agent API",
          "applicationCategory": "DeveloperApplication",
          "operatingSystem": "Any",
          "url": "https://capability.network/agent-package.json",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "description": "237-tool agent package for any LLM. Provision a key at POST /api/auth/provision, discover capabilities at GET /api/capabilities, build and settle contracts through milestone escrow. ERC-8004 identity at /.well-known/agent-registration.json.",
          "featureList": [
            "POST /api/auth/provision — get an API key (public)",
            "GET /api/capabilities — discover physical capabilities",
            "POST /api/build/contract — build a settleable contract",
            "GET /.well-known/agent-registration.json — ERC-8004 identity",
            "GET /agent-package.json — 237 tools for any LLM"
          ]
        }
      ]
    }
    </script>

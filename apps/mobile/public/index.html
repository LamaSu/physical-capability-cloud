<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A1A0F" />
    <title>PCC</title>
    <!--
      Offline / cold-start fallback for the Capacitor shell.

      The app normally loads the deployed PWA at https://capability.network via
      `server.url` (see capacitor.config.ts). This local page is the WebView's
      fallback when that remote is unreachable — set `server.errorPath: "index.html"`
      in the Capacitor config so the shell shows this instead of a blank/native
      error. It gives the app a genuine "minimum functionality" offline state,
      which Google Play review specifically checks (airplane-mode test) for
      remote-content wrapper apps.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #0A1A0F;
        color: #E6F2EA;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 24px; gap: 20px; min-height: 100dvh;
        -webkit-user-select: none; user-select: none;
      }
      .mark {
        width: 64px; height: 64px; border-radius: 16px;
        background: linear-gradient(140deg, #10B981, #0A6E4E);
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 26px; color: #041109; letter-spacing: 0.5px;
        box-shadow: 0 8px 30px rgba(16,185,129,0.25);
      }
      h1 { font-size: 20px; font-weight: 700; margin: 0; }
      p { margin: 0; max-width: 30ch; line-height: 1.5; color: #9DB5A8; font-size: 15px; }
      button {
        margin-top: 4px; appearance: none; border: 0; cursor: pointer;
        background: #10B981; color: #041109; font-weight: 700; font-size: 15px;
        padding: 13px 26px; border-radius: 12px;
      }
      button:active { transform: translateY(1px); }
      .status { font-size: 13px; color: #6C8579; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <div class="mark">PCC</div>
    <h1>You're offline</h1>
    <p>Physical Capability Cloud needs a connection to reach the network. Reconnect and try again.</p>
    <button id="retry" type="button">Try again</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>

    <script>
      var REMOTE = "https://capability.network";
      var statusEl = document.getElementById("status");

      function attempt() {
        statusEl.textContent = "Reconnecting…";
        // A successful navigation replaces this fallback with the live app.
        window.location.replace(REMOTE);
        // If we're still here shortly after, the remote is still unreachable.
        setTimeout(function () {
          statusEl.textContent = navigator.onLine
            ? "Still can't reach capability.network."
            : "No internet connection.";
        }, 2500);
      }

      document.getElementById("retry").addEventListener("click", attempt);
      // Auto-retry the moment the OS reports connectivity is back.
      window.addEventListener("online", attempt);
    </script>
  </body>
</html>

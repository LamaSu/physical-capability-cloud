let timer = null;
function classify(line) {
  if (line.includes('══')) return 'divider';
  if (line.includes('▸ ACT')) return 'act';
  if (line.includes('✓') && line.includes('PASS')) return 'pass';
  if (line.includes('[FOUND')) return 'found';
  if (line.includes('[ESCROW') || line.includes('locked')) return 'escrow';
  if (line.includes('SETTLED') || line.includes('collected')) return 'settled';
  if (line.includes('Full Protocol Stack')) return 'summary';
  if (line.startsWith('  ✓ W3C') || line.startsWith('  ✓ Meta') || line.startsWith('  ✓ Lit') || line.startsWith('  ✓ IPFS') || line.startsWith('  ✓ Bittensor') || line.startsWith('  ✓ ZK') || line.startsWith('  ✓ Native') || line.startsWith('  ✓ DePIN') || line.startsWith('  ✓ Unified') || line.startsWith('  ✓ A2A') || line.startsWith('  ✓ Meteora') || line.startsWith('  ✓ Evidence')) return 'stack';
  if (line.includes('TRILLION') || line.includes('Protocol Fee:') || line.includes('Producer Share')) return 'thesis';
  if (line.includes('PCCP')) return 'header';
  return '';
}

function startReplay(delay) {
  if (timer) clearInterval(timer);
  const out = document.getElementById('output');
  out.innerHTML = '';
  let i = 0;
  document.getElementById('speed').textContent = `Playing at ${delay}ms/line`;
  timer = setInterval(() => {
    if (i >= DEMO_LINES.length) { clearInterval(timer); return; }
    const line = DEMO_LINES[i++];
    const el = document.createElement('div');
    el.className = 'line ' + classify(line);
    el.textContent = line;
    el.style.animationDelay = '0s';
    out.appendChild(el);
    out.parentElement.scrollTop = out.parentElement.scrollHeight;
  }, delay);
}

function showAll() {
  if (timer) clearInterval(timer);
  const out = document.getElementById('output');
  out.innerHTML = DEMO_LINES.map(l => `<div class="line ${classify(l)}" style="opacity:1">${l.replace(/</g,'&lt;')}</div>`).join('');
  document.getElementById('speed').textContent = 'Showing all lines';
}

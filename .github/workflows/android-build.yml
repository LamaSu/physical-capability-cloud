# PCC Android — build a signed AAB in CI, optionally upload to a Play test track.
#
# SEPARATE from the gateway deploy pipeline (ci.yml / deploy-prod.yml / release.yml).
# It does NOT touch GHCR or Railway. Manual-trigger only (workflow_dispatch) so it
# never fires on push and never consumes CI minutes unattended.
#
# Build host rationale: the Android SDK + JDK toolchain isn't available locally
# (tablet has no JDK/SDK; Spark is aarch64). ubuntu-latest ships an x86 Android SDK.
#
# Secrets this workflow expects (set in repo Settings -> Secrets and variables ->
# Actions). All optional — with none set, it still builds a DEBUG-SIGNED AAB so you
# can prove the build works before wiring signing:
#   PCC_ANDROID_KEYSTORE_BASE64     base64 of the upload keystore (.jks)
#   PCC_ANDROID_KEYSTORE_PASSWORD   store password
#   PCC_ANDROID_KEY_ALIAS           key alias (e.g. pcc-upload)
#   PCC_ANDROID_KEY_PASSWORD        key password
#   PCC_PLAY_SERVICE_ACCOUNT_JSON   Play Developer API service-account JSON (upload track only)
#
# First upload to Play MUST be done manually in the Play Console (the Play Developer
# API cannot create the app record). The upload_track input is for release 2+.
name: Android Build

on:
  workflow_dispatch:
    inputs:
      upload_track:
        description: "Upload the built AAB to a Play track (requires an already-created app record + service-account secret)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - internal
  # Auto-run on pushes to the mobile feature branch so the AAB build self-verifies
  # in CI. master is intentionally NOT listed here — there it stays manual-only
  # (workflow_dispatch), consistent with the deploy-pipeline discipline.
  push:
    branches:
      - feat/android-build-publish

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Install dependencies (mobile + workspace deps)
        run: pnpm install --frozen-lockfile --filter @pcc/mobile...

      - name: Capacitor sync (regenerate native config + copy web assets)
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Configure signing
        id: signing
        env:
          KS_B64: ${{ secrets.PCC_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/pcc-upload.jks"
            echo "PCC_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pcc-upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release signing configured from PCC_ANDROID_KEYSTORE_BASE64."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No PCC_ANDROID_KEYSTORE_BASE64 secret set — building a DEBUG-SIGNED release AAB. It proves the build works but is NOT uploadable to Play."
          fi

      - name: Build signed release AAB
        working-directory: apps/mobile/android
        env:
          PCC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PCC_ANDROID_KEYSTORE_PASSWORD }}
          PCC_ANDROID_KEY_ALIAS: ${{ secrets.PCC_ANDROID_KEY_ALIAS }}
          PCC_ANDROID_KEY_PASSWORD: ${{ secrets.PCC_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcc-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Release 2+ only. Requires the app record to already exist in Play Console
      # (first upload is manual) and a service-account JSON secret. status:draft is
      # required while the app has not yet been published to production.
      - name: Upload to Play internal track
        if: ${{ inputs.upload_track == 'internal' && steps.signing.outputs.signed == 'true' && secrets.PCC_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PCC_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: network.capability.mobile
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

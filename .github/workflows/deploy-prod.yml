name: Deploy to Prod

# Manual promotion trigger. "Click Run workflow" IS the gate — equivalent to a
# required-reviewer rule, which GitHub Free can't enforce on private repos.
# Pick a commit SHA that has already been tagged :staging by the CI pipeline.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to promote to :prod (must exist as a GHCR tag already)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    # The environment still records the deployment in the GH UI even without
    # reviewer protection — useful for audit trails and the Deployments tab.
    environment:
      name: production
      url: https://capability.network
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify source image exists
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}:${{ inputs.sha }} > /dev/null

      - name: Retag ${sha} -> prod
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:prod \
            ghcr.io/${{ github.repository }}:${{ inputs.sha }}

      - name: Smoke test prod health endpoint
        run: |
          for i in $(seq 1 18); do
            sleep 10
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://capability.network/api/health" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "prod healthy"
              exit 0
            fi
          done
          echo "prod health check did not pass within 3 minutes"
          exit 1

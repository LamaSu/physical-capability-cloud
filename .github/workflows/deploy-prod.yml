name: Deploy to Prod

# Manual promotion trigger. "Click Run workflow" IS the gate — equivalent to a
# required-reviewer rule, which GitHub Free can't enforce on private repos.
# Pick a commit SHA that has already been tagged :staging by the CI pipeline.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to promote to :prod (must exist as a GHCR tag already)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    # The environment still records the deployment in the GH UI even without
    # reviewer protection — useful for audit trails and the Deployments tab.
    environment:
      name: production
      url: https://capability.network
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify source image exists
        run: |
          IMG=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools inspect "${IMG}:${{ inputs.sha }}" > /dev/null

      - name: Retag ${sha} -> prod
        run: |
          IMG=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create \
            --tag "${IMG}:prod" \
            "${IMG}:${{ inputs.sha }}"

      # Railway's image auto-watch does not reliably redeploy on a :prod manifest
      # change, so the retag above alone leaves prod on the OLD container while the
      # health smoke below would false-green against it. Force a redeploy and gate on
      # a NEW deployment reaching SUCCESS (deploy-truth), not on an HTTP 200.
      - name: Redeploy prod on Railway + wait for the NEW deployment to succeed
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PROD_SERVICE_ID: 995c4eed-ee96-47a0-9bab-9a5cb93e4064
          PROD_ENV_ID: d0b84123-01b2-40da-a96d-252f492ca471
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_API_TOKEN:-}" ]; then
            echo "::error::RAILWAY_API_TOKEN secret not set — cannot redeploy prod."; exit 1
          fi
          # --fail-with-body: nonzero exit on HTTP >=400 (so set -e catches API failures); body still printed.
          api() { curl -sS --fail-with-body https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" -d "$1"; }
          # A GraphQL error arrives as HTTP 200 with an { errors: [...] } body — curl can't see it.
          gqlerr() { echo "$1" | jq -e '.errors' >/dev/null 2>&1; }
          Q_LATEST="{\"query\":\"query { serviceInstance(serviceId: \\\"$PROD_SERVICE_ID\\\", environmentId: \\\"$PROD_ENV_ID\\\") { latestDeployment { id status } } }\"}"
          Q_REDEPLOY="{\"query\":\"mutation { serviceInstanceRedeploy(serviceId: \\\"$PROD_SERVICE_ID\\\", environmentId: \\\"$PROD_ENV_ID\\\") }\"}"
          # Baseline MUST succeed: a failed query here would leave old="" and let the first poll accept
          # the OLD still-running deployment's stale SUCCESS. Fail hard so old="" can ONLY mean no-prior-deploy.
          base=$(api "$Q_LATEST") || { echo "::error::baseline latestDeployment query failed"; exit 1; }
          if gqlerr "$base"; then echo "::error::baseline GraphQL error: $(echo "$base" | jq -c '.errors')"; exit 1; fi
          old=$(echo "$base" | jq -r '.data.serviceInstance.latestDeployment.id // ""')
          echo "old deployment: ${old:-none (no prior deployment)}"
          resp=$(api "$Q_REDEPLOY") || { echo "::error::redeploy request failed (HTTP)"; exit 1; }
          if gqlerr "$resp"; then echo "::error::redeploy GraphQL error: $(echo "$resp" | jq -c '.errors')"; exit 1; fi
          echo "$resp" | jq -e '.data.serviceInstanceRedeploy == true' >/dev/null || { echo "::error::redeploy returned non-true: $resp"; exit 1; }
          # Gate on a *new* deployment id reaching SUCCESS — never the old one's stale SUCCESS.
          for i in $(seq 1 40); do
            sleep 10
            dep=$(api "$Q_LATEST") || { echo "attempt $i: query failed (transient), retrying"; continue; }
            if gqlerr "$dep"; then echo "attempt $i: GraphQL error (transient), retrying"; continue; fi
            id=$(echo "$dep" | jq -r '.data.serviceInstance.latestDeployment.id // ""')
            st=$(echo "$dep" | jq -r '.data.serviceInstance.latestDeployment.status // ""')
            echo "attempt $i: id=${id:0:8} status=${st:-pending}"
            if [ -n "$id" ] && [ "$id" != "$old" ]; then
              case "$st" in
                SUCCESS) echo "new prod deployment live"; exit 0;;
                FAILED|CRASHED|REMOVED|SKIPPED) echo "::error::new prod deployment $st"; exit 1;;
              esac
            fi
          done
          echo "::error::prod deployment did not reach SUCCESS in time"; exit 1

      - name: Smoke test prod health endpoint
        run: |
          for i in $(seq 1 18); do
            sleep 10
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://capability.network/api/health" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "prod healthy"
              exit 0
            fi
          done
          echo "prod health check did not pass within 3 minutes"
          exit 1

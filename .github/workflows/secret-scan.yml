name: Secret scan (trusted)

# Board row N44. The enforcing secret scan for pull requests.
#
# A pull request's own code can rewrite the git index before a scanner reads it,
# and a pull_request workflow runs the pull request's own copy of its workflow
# file. So this workflow runs on pull_request_target: GitHub takes its definition
# from the base branch. The scan jobs check out the base commit only, fetch the
# pull request's head commit as objects, and scan it with the base branch's
# scanner: the head commit's tree, and every object the pull request introduces
# (each commit, tree and blob, so a key added and later removed is still found).
# They also scan the pull request's title and description, and run again when
# they are edited. No code from the pull request is checked out or run, and the
# scan jobs hold no secret: their token can only read.
#
# The verdict (round 6). GitHub attaches a pull_request_target job's result to
# the BASE commit, and any workflow a pull request adds can run a job with the
# same name on the pull request's own commit. So the jobs below are not the
# required checks. The post-verdicts job turns their results into two check
# runs on the pull request's HEAD commit, pcc-trusted/secret-scan and
# pcc-trusted/trust-root-guard, posted as a dedicated GitHub App
# (scripts/ci/post-trusted-verdicts.mjs). Branch protection requires those two
# from that App, and nothing a pull request runs can post as it. The App's key
# is a secret of the trusted-checks environment, which only master may deploy
# to: a pull_request run (refs/pull/N/merge) or a merge-queue run cannot read
# it, and a fork's pull_request run gets no secrets at all. A verdict is posted
# only while the pull request still has the head commit, title and description
# this run scanned; otherwise the newer run posts.
#
# The trust root. Once it is on master, any workflow file can name the
# trusted-checks environment. So the trust-root-guard job fails any pull request
# that changes a file under .github/workflows/ or .github/actions/, the scanner,
# the guard, the verdict script, or a CODEOWNERS file. Its definition comes from
# the base branch, and it re-runs on every push to the pull request, so a no-op
# swapped in after an approval fails as well. Landing such a change needs the
# operator to override that required check knowingly.
#
# The repository settings are the operator's to make (operator item 77):
#   1. A GitHub App owned by the repository owner, installed on this repository
#      only, with Checks: read and write, and Pull requests: read. Nothing else,
#      and no webhook.
#   2. An environment named trusted-checks whose deployment branches are
#      "Selected branches": master only. Make the rule BEFORE adding secrets: a
#      job that names a missing environment creates it with no rule. Its
#      secrets: TRUSTED_CHECKS_APP_ID and TRUSTED_CHECKS_PRIVATE_KEY. No
#      required reviewers: every pull request's verdict would wait on one.
#   3. REQUIRED (the guarantee depends on it): on master, the status checks
#      pcc-trusted/secret-scan and pcc-trusted/trust-root-guard are required
#      with that App as their source (its app_id), never "any source". Then a
#      pull request that adds a key, or that changes the trust root, cannot
#      merge unless the operator overrides the check knowingly.
#   4. Recommended hardening: a CODEOWNERS file naming the trust root's owner;
#      "require review from code owners"; "require approval of the most recent
#      push"; and no bypass for non-admins.
#   5. No merge queue. A merge_group run executes the workflow files of the
#      queue's commit, which a pull request can add to, so no secret-bearing
#      step may run there; and the App's checks would never report on a queue
#      commit, so enabling a queue with them required stalls every merge.
# Trusted by design, outside this mechanism: anyone who can push a branch to
# this repository (a same-repository pull_request run gets secrets), and the
# merge commit's message, written at merge time (a squash message defaults to
# the title and description, which are scanned).
#
# On a push to master the commit is already public, so that scan is detection:
# it scans what the push added, and a push that creates the branch scans its
# whole history.
#
# This file does not run for the pull request that adds it, because the base
# branch does not have it yet; that one change rests on its review.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [master]

permissions:
  contents: read

# One run per pull request: a push or an edit cancels the run it supersedes.
# Pushes to master each get their own group and are never cancelled.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  trusted-secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the base commit only (never the code under test)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan the pull request's head commit with the base branch's scanner
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The exact commit this event names, fetched as objects (never checked out).
          git fetch --no-tags --quiet origin "$HEAD_SHA"
          node scripts/ci/secret-scan.mjs --tree "$HEAD_SHA" --range "${BASE_SHA}..${HEAD_SHA}"

      - name: Scan the pull request's title and description
        if: github.event_name == 'pull_request_target'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | node scripts/ci/secret-scan.mjs --text "the pull request's title and description"

      - name: Scan what the push added
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            node scripts/ci/secret-scan.mjs --tree HEAD --history HEAD
          else
            node scripts/ci/secret-scan.mjs --tree HEAD --range "${BEFORE}..HEAD"
          fi

  trust-root-guard:
    # Fails a change that touches the trust root (see the header). Only for a
    # pull request: on a push the commit is already on master, and the scan
    # above is detection. This definition comes from the base branch.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the base commit only (never the code under test)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refuse a change to the trust root
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The commit this event names, fetched as objects (never checked out).
          git fetch --no-tags --quiet origin "$HEAD_SHA"
          node scripts/ci/trust-root-guard.mjs "$BASE_SHA" "$HEAD_SHA"

  post-verdicts:
    # The required checks (see the header): both jobs' results, posted on the
    # pull request's head commit as the trusted App. It runs once both have
    # finished, whatever their result, and never for a run cancelled by a
    # newer one. The only job with a secret; it runs nothing from the pull
    # request, and only the runner's own Node.js.
    needs: [trusted-secret-scan, trust-root-guard]
    if: ${{ github.event_name == 'pull_request_target' && !cancelled() }}
    runs-on: ubuntu-latest
    environment: trusted-checks

    steps:
      - name: Check out the base commit only (never the code under test)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Post the verdicts on the pull request's head commit as the trusted App
        env:
          TRUSTED_CHECKS_APP_ID: ${{ secrets.TRUSTED_CHECKS_APP_ID }}
          TRUSTED_CHECKS_PRIVATE_KEY: ${{ secrets.TRUSTED_CHECKS_PRIVATE_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          SCAN_RESULT: ${{ needs.trusted-secret-scan.result }}
          GUARD_RESULT: ${{ needs.trust-root-guard.result }}
        run: node scripts/ci/post-trusted-verdicts.mjs

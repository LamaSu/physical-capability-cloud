name: Secret scan (trusted)

# Board row N44. The enforcing secret scan for pull requests and the merge queue.
#
# A pull request's own code can rewrite the git index before a scanner reads it,
# and a pull_request workflow runs the pull request's own copy of its workflow
# file. So this workflow runs on pull_request_target: GitHub takes its definition
# from the base branch. The job checks out the base commit only, fetches the
# pull request's head commit as objects, and scans it with the base branch's
# scanner: the head commit's tree, and every object the pull request introduces
# (each commit, tree and blob, so a key added and later removed is still found).
# It also scans the pull request's title and description, and runs again when
# they are edited. No code from the pull request is checked out or run, no
# secret is used, and the token can only read.
#
# The trust root (round 5). On merge_group GitHub reads this file from the
# queue's commit, which carries the pull request's own changes. So the
# trust-root-guard job below fails any pull request that changes this file,
# scripts/ci/secret-scan.mjs, scripts/ci/trust-root-guard.mjs or a CODEOWNERS
# file. Its definition comes from the base branch, and it re-runs on every push
# to the pull request, so a no-op swapped in after an approval fails too.
#
# What this guarantees depends on repository settings, which are the
# operator's to make:
#   1. REQUIRED (the guarantee depends on it): trusted-secret-scan and
#      trust-root-guard are required status checks on master. Then a pull
#      request that adds a key, or that changes the trust root, cannot merge
#      unless the operator overrides the check knowingly.
#   2. Recommended hardening: a CODEOWNERS file naming the trust root's owner;
#      "require review from code owners"; "require approval of the most recent
#      push" (or dismiss stale approvals); and no bypass for non-admins.
#   3. The commit that lands on master is not the pull request's head. A
#      squash or merge commit carries a message written at merge time (by
#      default the pull request's title), and "[skip ci]" in that message
#      stops the push workflows. Only a merge queue scans that exact commit
#      before master moves (the merge_group steps below scan its tree and
#      everything it adds, message included). This change does not turn the
#      queue on. If the operator does, ci.yml must also run on merge_group, with
#      every image and deploy job limited to push, or its required checks never
#      report in the queue.
#
# On a push to master the commit is already public, so that scan is detection:
# it scans what the push added, and a push that creates the branch scans its
# whole history.
#
# This file does not run for the pull request that adds it, because the base
# branch does not have it yet; that one change rests on its review.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  trusted-secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the base commit only (never the code under test)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan the pull request's head commit with the base branch's scanner
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The exact commit this event names, fetched as objects (never checked out).
          git fetch --no-tags --quiet origin "$HEAD_SHA"
          node scripts/ci/secret-scan.mjs --tree "$HEAD_SHA" --range "${BASE_SHA}..${HEAD_SHA}"

      - name: Scan the pull request's title and description
        if: github.event_name == 'pull_request_target'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | node scripts/ci/secret-scan.mjs --text "the pull request's title and description"

      - name: Scan the merge queue's commit with the base branch's scanner
        if: github.event_name == 'merge_group'
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # The commit the queue would put on master, fetched as objects (never checked out).
          git fetch --no-tags --quiet origin "$HEAD_SHA"
          node scripts/ci/secret-scan.mjs --tree "$HEAD_SHA" --range "${BASE_SHA}..${HEAD_SHA}"

      - name: Scan what the push added
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            node scripts/ci/secret-scan.mjs --tree HEAD --history HEAD
          else
            node scripts/ci/secret-scan.mjs --tree HEAD --range "${BEFORE}..HEAD"
          fi

  trust-root-guard:
    # Fails a change that touches the trust root (see the header). Not on
    # push: by then the commit is on master, and the scan above is detection.
    # On pull_request_target this definition comes from the base branch. On
    # merge_group it comes from the queue's commit, whose pull requests each
    # passed this check against their base, and it checks the queue's range.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the base commit only (never the code under test)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refuse a change to the trust root
        env:
          HEAD_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BASE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # The commit this event names, fetched as objects (never checked out).
          git fetch --no-tags --quiet origin "$HEAD_SHA"
          node scripts/ci/trust-root-guard.mjs "$BASE_SHA" "$HEAD_SHA"

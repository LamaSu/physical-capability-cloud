name: Secret scan (trusted)

# Board row N44. The enforcing secret scan for pull requests.
#
# A pull request's own code can rewrite the git index before a scanner reads it,
# and a pull_request workflow runs the pull request's own copy of its workflow
# file. So this workflow runs on pull_request_target: GitHub takes its definition
# from the base branch. The job checks out the base commit only, fetches the
# pull request's head commit as objects, and scans it with the base branch's
# scanner: the head commit's tree, and every object the pull request introduces
# (each commit, tree and blob, so a key added and later removed is still found).
# No code from the pull request is checked out or run, no secret is used, and
# the token can only read.
#
# This file does not run for the pull request that adds it, because the base
# branch does not have it yet; that one change rests on its review.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  trusted-secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the base commit only (never the pull request's code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan the pull request's head commit with the base branch's scanner
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The exact commit this event names, fetched as objects (never checked out).
          git fetch --no-tags --quiet origin "$HEAD_SHA"
          node scripts/ci/secret-scan.mjs --tree "$HEAD_SHA" --range "${BASE_SHA}..${HEAD_SHA}"

      - name: Scan what the push added
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            node scripts/ci/secret-scan.mjs --tree HEAD
          else
            node scripts/ci/secret-scan.mjs --tree HEAD --range "${BEFORE}..HEAD"
          fi

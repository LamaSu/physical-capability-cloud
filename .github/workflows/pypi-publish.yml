# Publish pcc-node to PyPI with PyPI's Trusted Publisher (OIDC). No API token
# exists: PyPI trusts this file (pypi-publish.yml) in LamaSu/physical-capability-cloud.
#
# Trigger: push a tag named pcc-node-v<version>, e.g. pcc-node-v0.1.1. A tag push
# runs the workflow and builds the code AS OF THE TAGGED COMMIT, so a release can
# ship from a release commit before that commit reaches master.
#
# Three jobs. The token that can publish never exists where downloaded code
# runs, and what is published is checked where no downloaded code ran:
# - build has no id-token permission. It installs `build` (which fetches the
#   setuptools backend), builds the sdist and wheel, and uploads them. It also
#   runs the release gate (.github/scripts/check_pcc_node_dist.py, stdlib only),
#   but that run is only an early warning: the backend ran on the same runner
#   and could have changed the gate or the files.
# - verify has no id-token permission either. On a fresh runner and checkout
#   that installs and builds nothing, it self-tests the gate and runs it on the
#   artifact exactly as uploaded, which is immutable once build ends. This is
#   the check that counts.
# - publish runs only after verify, in the `pypi` environment, whose required
#   reviewer approves each publish. It downloads that same artifact and uploads
#   it, with PEP 740 attestations (signed provenance, not extra packages).
#
# Every action is pinned to a full commit SHA; the tag each one was taken from
# is in the comment next to it.
name: Publish pcc-node to PyPI

on:
  push:
    tags:
      - "pcc-node-v*"

permissions:
  contents: read

concurrency:
  group: pypi-publish-pcc-node
  cancel-in-progress: false

jobs:
  build:
    name: Build and check pcc-node
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Self-test the release gate (a weakened gate fails here)
        run: python .github/scripts/test_check_pcc_node_dist.py -v

      - name: Build the sdist and wheel
        working-directory: packages/pcc-node
        run: |
          python -m pip install build==1.6.1
          python -m build --outdir dist

      - name: Early warning only (verify runs the check that counts)
        run: python .github/scripts/check_pcc_node_dist.py --tag "$GITHUB_REF_NAME" packages/pcc-node/dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pcc-node-dist
          path: packages/pcc-node/dist/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Check the uploaded artifact on a clean runner
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Self-test the release gate
        run: python .github/scripts/test_check_pcc_node_dist.py -v

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pcc-node-dist
          path: dist/

      - name: List the wheel and sdist, and refuse executor.py, shell=True, key material or odd archive entries
        run: python .github/scripts/check_pcc_node_dist.py --tag "$GITHUB_REF_NAME" dist

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/pcc-node/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pcc-node-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

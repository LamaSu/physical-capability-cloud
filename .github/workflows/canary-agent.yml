# Agent-onboarding observability — piece 6: synthetic canary.
#
# Runs scripts/canary-agent-onboarding.mjs against staging on a cron. It walks
# the real onboarding funnel (consuming the live agent-package.json) and files a
# pcc_report on failure.
#
# HALT-SAFE: this workflow is INERT until deliberately enabled. The job runs only
# when the repo variable CANARY_ENABLED == 'true' AND a STAGING_URL is set. Merging
# this PR changes nothing — no deploy, no run against any environment. To enable:
#   Settings → Secrets and variables → Actions → Variables:
#     CANARY_ENABLED = true
#     STAGING_URL    = https://staging.capability.network
#
# Before enabling, pin the actions below to commit SHAs (see /pin-actions).
name: canary-agent

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (GH may delay/skip under load — paired with a push heartbeat)
  workflow_dispatch:
    inputs:
      target:
        description: "Target base URL (defaults to STAGING_URL repo variable)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: canary-agent
  cancel-in-progress: false

jobs:
  canary:
    # HALT-safe gate — inert unless explicitly switched on.
    if: ${{ vars.CANARY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # TODO pin to SHA before enabling

      - uses: actions/setup-node@v4 # TODO pin to SHA before enabling
        with:
          node-version: "22"

      - name: Run onboarding canary
        id: canary
        env:
          CANARY_TARGET: ${{ inputs.target || vars.STAGING_URL }}
          CANARY_HEARTBEAT_URL: ${{ secrets.CANARY_HEARTBEAT_URL }}
        run: node scripts/canary-agent-onboarding.mjs --target="$CANARY_TARGET"

      - name: Open issue on canary failure
        if: ${{ failure() }}
        uses: actions/github-script@v7 # TODO pin to SHA before enabling
        with:
          script: |
            const title = "🐤 canary-fail: agent onboarding regression";
            const body = [
              `The onboarding canary failed against \`${process.env.CANARY_TARGET || 'staging'}\`.`,
              ``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Check the step log for the \`CANARY_RESULT={...}\` line (stage_reached / failed_stage / trace_id).`,
              `- The canary also filed a \`pcc_report\` (agent_kind=canary) — look it up by trace_id in the troubleshooting view.`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "canary-fail", per_page: 1,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ["canary-fail"] });
            }
        env:
          CANARY_TARGET: ${{ inputs.target || vars.STAGING_URL }}

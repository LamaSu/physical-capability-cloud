name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build --concurrency=1

      - name: Run tests
        run: pnpm --workspace-concurrency=1 -r test

      - name: Type check
        run: pnpm -r exec tsc --noEmit

  forge-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        working-directory: packages/contracts
        run: |
          if [ -d "lib/forge-std" ] && [ -f "lib/forge-std/src/Test.sol" ]; then
            echo "forge-std already present from submodule checkout"
          else
            forge install foundry-rs/forge-std --no-git
          fi

      - name: Run Solidity tests
        working-directory: packages/contracts
        run: forge test -vvv

  # Build a single Docker artifact on every master push.
  # The same SHA-tagged image is later retagged to `staging` and `prod`
  # — build once, deploy many.
  build-image:
    runs-on: ubuntu-latest
    needs: [build-and-test, forge-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      sha_tag: ${{ github.sha }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Retag the SHA image as `staging` (no rebuild).
  # Railway's staging environment watches ghcr.io/<repo>:staging and
  # redeploys when the manifest changes — deploy is measured in seconds.
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retag ${sha} -> staging
        run: |
          IMG=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create \
            --tag "${IMG}:staging" \
            "${IMG}:${{ github.sha }}"

      - name: Smoke test staging health endpoint
        if: vars.STAGING_URL != ''
        run: |
          # Railway pulls the new :staging manifest; give it up to 3 minutes
          # to complete the rolling restart before we probe /api/health.
          for i in $(seq 1 18); do
            sleep 10
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.STAGING_URL }}/api/health" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "staging healthy"
              exit 0
            fi
          done
          echo "staging health check did not pass within 3 minutes"
          exit 1

  # Prod promotion lives in .github/workflows/deploy-prod.yml as a
  # workflow_dispatch trigger. That "click to run" is our manual gate:
  # GitHub Free + private repos can't enforce required-reviewer rules on
  # environments, but a manual dispatch requires the same human intent.

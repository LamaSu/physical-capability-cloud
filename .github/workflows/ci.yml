name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build --concurrency=1

      - name: Run tests
        run: pnpm --workspace-concurrency=1 -r test

      - name: Type check
        run: pnpm -r exec tsc --noEmit

      - name: Agent-pack onboarding smoke (skipped when ANTHROPIC_API_KEY absent)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PCC_GATEWAY_URL: https://capability.network
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping onboarding smoke (PASS for branches without the secret)"
            exit 0
          fi
          pnpm --filter @pcc/gateway exec tsx scripts/smoke-onboarding-prompt.ts

  forge-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        working-directory: packages/contracts
        run: |
          if [ -d "lib/forge-std" ] && [ -f "lib/forge-std/src/Test.sol" ]; then
            echo "forge-std already present from submodule checkout"
          else
            forge install foundry-rs/forge-std --no-git
          fi

      - name: Run Solidity tests
        working-directory: packages/contracts
        run: forge test -vvv

  # Build a single Docker artifact on every master push.
  # The same SHA-tagged image is later retagged to `staging` and `prod`
  # — build once, deploy many.
  build-image:
    runs-on: ubuntu-latest
    needs: [build-and-test, forge-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      sha_tag: ${{ github.sha }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Retag the SHA image as `staging` (no rebuild).
  # Railway's staging environment watches ghcr.io/<repo>:staging and
  # redeploys when the manifest changes — deploy is measured in seconds.
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retag ${sha} -> staging
        run: |
          IMG=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create \
            --tag "${IMG}:staging" \
            "${IMG}:${{ github.sha }}"

      # Railway's image auto-watch does not reliably redeploy on a :staging manifest
      # change (staging drifted stale for days under exactly this), so force a redeploy
      # and gate on a NEW deployment reaching SUCCESS. Unlike the manually-dispatched
      # prod job, this runs on every master push — so if the token secret is missing it
      # SKIPS with a warning rather than reddening all of master CI.
      - name: Redeploy staging on Railway + wait for the NEW deployment to succeed
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          STG_SERVICE_ID: 995c4eed-ee96-47a0-9bab-9a5cb93e4064
          STG_ENV_ID: 990d7e9b-2079-4f50-b7a8-e2035444adc5
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_API_TOKEN:-}" ]; then
            echo "::warning::RAILWAY_API_TOKEN not set — skipping staging redeploy (staging may stay stale until the secret is added)."
            exit 0
          fi
          # --fail-with-body: nonzero exit on HTTP >=400 (so set -e catches API failures); body still printed.
          api() { curl -sS --fail-with-body https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" -d "$1"; }
          # A GraphQL error arrives as HTTP 200 with an { errors: [...] } body — curl can't see it.
          gqlerr() { echo "$1" | jq -e '.errors' >/dev/null 2>&1; }
          Q_LATEST="{\"query\":\"query { serviceInstance(serviceId: \\\"$STG_SERVICE_ID\\\", environmentId: \\\"$STG_ENV_ID\\\") { latestDeployment { id status } } }\"}"
          Q_REDEPLOY="{\"query\":\"mutation { serviceInstanceRedeploy(serviceId: \\\"$STG_SERVICE_ID\\\", environmentId: \\\"$STG_ENV_ID\\\") }\"}"
          # Baseline MUST succeed: a failed query here would leave old="" and let the first poll accept
          # the OLD still-running deployment's stale SUCCESS. Fail hard so old="" can ONLY mean no-prior-deploy.
          base=$(api "$Q_LATEST") || { echo "::error::baseline latestDeployment query failed"; exit 1; }
          if gqlerr "$base"; then echo "::error::baseline GraphQL error: $(echo "$base" | jq -c '.errors')"; exit 1; fi
          old=$(echo "$base" | jq -r '.data.serviceInstance.latestDeployment.id // ""')
          echo "old deployment: ${old:-none (no prior deployment)}"
          resp=$(api "$Q_REDEPLOY") || { echo "::error::redeploy request failed (HTTP)"; exit 1; }
          if gqlerr "$resp"; then echo "::error::redeploy GraphQL error: $(echo "$resp" | jq -c '.errors')"; exit 1; fi
          echo "$resp" | jq -e '.data.serviceInstanceRedeploy == true' >/dev/null || { echo "::error::redeploy returned non-true: $resp"; exit 1; }
          for i in $(seq 1 40); do
            sleep 10
            dep=$(api "$Q_LATEST") || { echo "attempt $i: query failed (transient), retrying"; continue; }
            if gqlerr "$dep"; then echo "attempt $i: GraphQL error (transient), retrying"; continue; fi
            id=$(echo "$dep" | jq -r '.data.serviceInstance.latestDeployment.id // ""')
            st=$(echo "$dep" | jq -r '.data.serviceInstance.latestDeployment.status // ""')
            echo "attempt $i: id=${id:0:8} status=${st:-pending}"
            if [ -n "$id" ] && [ "$id" != "$old" ]; then
              case "$st" in
                SUCCESS) echo "new staging deployment live"; exit 0;;
                FAILED|CRASHED|REMOVED|SKIPPED) echo "::error::new staging deployment $st"; exit 1;;
              esac
            fi
          done
          echo "::error::staging deployment did not reach SUCCESS in time"; exit 1

      - name: Smoke test staging health endpoint
        if: vars.STAGING_URL != ''
        run: |
          # Railway pulls the new :staging manifest; give it up to 3 minutes
          # to complete the rolling restart before we probe /api/health.
          for i in $(seq 1 18); do
            sleep 10
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.STAGING_URL }}/api/health" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "staging healthy"
              exit 0
            fi
          done
          echo "staging health check did not pass within 3 minutes"
          exit 1

  # Prod promotion lives in .github/workflows/deploy-prod.yml as a
  # workflow_dispatch trigger. That "click to run" is our manual gate:
  # GitHub Free + private repos can't enforce required-reviewer rules on
  # environments, but a manual dispatch requires the same human intent.

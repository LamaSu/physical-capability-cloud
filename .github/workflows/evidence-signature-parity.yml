# LO-EV-1 signature parity (board row R20; cross-family reviews A01 and A01c-q2).
# The Python mirror's signature half must never pass by skipping, deselecting,
# xfailing or dropping a test. tests/signature_manifest_check.py derives the
# manifest of PyNaCl tests (every test taking the `nacl` fixture, times its
# golden vectors), runs exactly that manifest with external pytest options
# neutralized and --runxfail, and reads the outcome of every test from JUnit XML.
# The negative control runs the SAME manifest without PyNaCl, and every test must
# fail on the PyNaCl requirement itself. Then the whole parity file runs with the
# same neutralization, and any skipped, deselected, xfailed, xpassed or errored
# test fails the job. Every Python run is isolated (python -I -B: no PYTHONPATH, no
# script or working directory on sys.path, no user site; pytest -c /dev/null: no ini;
# --noconftest), and the checker first refuses a test module that could name pytest
# plugins or hooks (its selftest proves that). Hostile conftest.py, sitecustomize.py
# and usercustomize.py files are planted first: if any run loads one, the job fails
# (cross-family reviews A01d, A01e).
name: evidence-signature-parity

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Installs pinned PyPI packages, so the token gets read-only access.
permissions:
  contents: read

jobs:
  pcc-node-signature-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/pcc-node
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plant hostile conftest.py, sitecustomize.py and usercustomize.py files that no run may load
        run: |
          for d in . tests; do
            cat > "$d/conftest.py" <<EOF
          import pathlib
          pathlib.Path("$RUNNER_TEMP/conftest-was-loaded").touch()
          def pytest_collection_modifyitems(items):
              for item in items:
                  item.runtest = lambda: None
          EOF
          done
          for d in ../.. . tests; do
            for m in sitecustomize usercustomize; do
              printf 'import pathlib\npathlib.Path("%s/startup-hook-ran").touch()\n' "$RUNNER_TEMP" > "$d/$m.py"
            done
          done

      - name: Negative control - without PyNaCl the required run must fail on the PyNaCl check
        run: |
          python -m venv "$RUNNER_TEMP/no-nacl"
          "$RUNNER_TEMP/no-nacl/bin/python" -m pip install --quiet "pytest==8.3.5"
          if "$RUNNER_TEMP/no-nacl/bin/python" -c "import nacl" 2>/dev/null; then
            echo "invalid control: PyNaCl is importable in the venv without it"
            exit 1
          fi
          # Every manifest test must be collected and fail on the PyNaCl requirement.
          "$RUNNER_TEMP/no-nacl/bin/python" -I -B tests/signature_manifest_check.py negative
          for marker in conftest-was-loaded startup-hook-ran; do
            if [ -e "$RUNNER_TEMP/$marker" ]; then
              echo "a planted hook ran in the negative control ($marker)"
              exit 1
            fi
          done

      - name: Signature parity (PyNaCl required, nothing may skip)
        env:
          PCC_REQUIRE_PYNACL: "1"
        run: |
          python -m pip install --quiet "pynacl==1.5.0" "pytest==8.3.5"
          # The hook guard must refuse every hostile shape, then every manifest test
          # must be collected and pass (JUnit XML, not the text summary).
          python -I -B tests/signature_manifest_check.py selftest
          python -I -B tests/signature_manifest_check.py positive
          # The whole parity file, with external options neutralized: nothing may be
          # skipped, deselected, xfailed, xpassed or errored.
          set +e
          out=$(env -u PYTEST_ADDOPTS -u PYTEST_PLUGINS PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            python -I -B -m pytest -q -c /dev/null --rootdir . -p no:cacheprovider --noconftest --runxfail \
            -o addopts= -rs tests/test_signing_preimage_parity.py 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if echo "$out" | grep -Eq "[0-9]+ (skipped|deselected|xfailed|xpassed|error)"; then
            echo "a test was skipped, deselected, xfailed, xpassed or errored in the required run"
            exit 1
          fi
          for marker in conftest-was-loaded startup-hook-ran; do
            if [ -e "$RUNNER_TEMP/$marker" ]; then
              echo "a planted hook ran in the required run ($marker)"
              exit 1
            fi
          done
